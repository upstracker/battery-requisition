name: Build Windows Installer (Win 7/8/10/11)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10 (Max Windows 7/8/10/11 Compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Application with PyInstaller
        run: |
          pyinstaller app.spec --clean -y

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Package Portable Zip
        run: |
          Compress-Archive -Path dist\BatteryRequisition\* -DestinationPath dist_installer\BatteryRequisition_Portable_v1.0.0.zip

      - name: Upload Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup_BatteryRequisition_v1.0.0_Installer
          path: dist_installer/Setup_BatteryRequisition_v1.0.0.exe
          if-no-files-found: error

      - name: Upload Portable (.zip) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryRequisition_Portable_v1.0.0_Zip
          path: dist_installer/BatteryRequisition_Portable_v1.0.0.zip
          if-no-files-found: error
